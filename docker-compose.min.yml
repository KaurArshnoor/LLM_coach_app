version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: coaching_app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: .
      dockerfile: Dockerfile.min
    environment:
      GROK_API_KEY: ${GROK_API_KEY}
      DATABASE_URL: postgresql://postgres:postgres@postgres/coaching_app_db
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./load_data.py:/app/load_data.py
      - ./exercises.csv:/app/exercises.csv

volumes:
  postgres_data:
